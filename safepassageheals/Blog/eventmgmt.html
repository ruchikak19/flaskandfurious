<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
 
  const BACKEND = 'https://flaskandfurious.opencodingsociety.com/';

  let dtTable = null;
  let eventsCache = [];

  function showToast(msg, type = 'success') {
    const t = document.getElementById('emToast');
    t.className = `em-toast ${type}`;
    t.innerHTML = `<i class="fa ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"
                     style="color:${type === 'success' ? 'var(--em-success)' : 'var(--em-danger)'}"></i> ${msg}`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  function renderTable(events) {
    const tbody = document.getElementById('eventTableBody');

    if (!events.length) {
      tbody.innerHTML = `<tr><td colspan="9">
        <div class="em-empty">
          <i class="fa fa-calendar-times"></i>
          <p>No events found.</p>
        </div>
      </td></tr>`;
      return;
    }

    tbody.innerHTML = events.map(ev => {
      const flyerHtml = ev.flyer
        ? `<img src="${BACKEND}${ev.flyer}" class="em-flyer-thumb" alt="Flyer">`
        : `<div class="em-no-flyer"><i class="fa fa-image"></i></div>`;

      const regHtml = ev.registration
        ? `<a href="${ev.registration}" target="_blank" class="em-reg-link">
             <i class="fa fa-external-link-alt"></i> Link
           </a>`
        : `<span style="color:var(--em-muted)">—</span>`;

      const writeupShort = ev.writeup
        ? `<span title="${ev.writeup.replace(/"/g,'&quot;')}"
               style="max-width:130px;display:inline-block;white-space:nowrap;
                      overflow:hidden;text-overflow:ellipsis;font-size:0.78rem;
                      color:var(--em-muted)">${ev.writeup}</span>`
        : `<span style="color:var(--em-muted)">—</span>`;

      return `<tr id="ev-row-${ev.id}">
        <td style="color:var(--em-muted);font-size:0.78rem;font-weight:600;">#${ev.id}</td>
        <td class="em-title-cell" title="${ev.title}">${ev.title}</td>
        <td><span class="em-date-badge">${ev.event_date || '—'}</span></td>
        <td><span class="em-time-badge">${ev.event_time || '—'}</span></td>
        <td class="em-location-cell" title="${ev.location || ''}">${ev.location || '—'}</td>
        <td>${flyerHtml}</td>
        <td>${regHtml}</td>
        <td>${writeupShort}</td>
        <td style="white-space:nowrap;">
          <button class="em-btn em-btn-edit" onclick="openEdit(${ev.id})">
            <i class="fa fa-pen"></i> Edit
          </button>
          <button class="em-btn em-btn-delete" onclick="deleteEvent(${ev.id})" style="margin-left:5px;">
            <i class="fa fa-trash"></i> Delete
          </button>
        </td>
      </tr>`;
    }).join('');

    if (dtTable) dtTable.destroy();
    dtTable = $('#eventTable').DataTable({
      pageLength: 10,
      order: [[2, 'asc']],
      columnDefs: [{ orderable: false, targets: [5, 6, 7, 8] }],
      language: { emptyTable: "No events to display.", search: "Search:" }
    });
  }

  async function loadEvents() {
    try {
      const res = await fetch(`${BACKEND}/api/events`);
      if (!res.ok) throw new Error('Failed to load events');
      eventsCache = await res.json();
      renderTable(eventsCache);
    } catch (err) {
      document.getElementById('eventTableBody').innerHTML =
        `<tr><td colspan="9" style="color:var(--em-danger);text-align:center;padding:2rem;">
           <i class="fa fa-exclamation-triangle"></i> ${err.message}
         </td></tr>`;
    }
  }

  async function deleteEvent(id) {
    if (!confirm(`Delete event #${id}? This cannot be undone.`)) return;
    try {
      const res = await fetch(`${BACKEND}/api/events/delete/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete failed');
      showToast('Event deleted successfully.');
      loadEvents();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function openEdit(id) {
    const ev = eventsCache.find(e => e.id === id);
    if (!ev) return;
    document.getElementById('editId').value           = ev.id;
    document.getElementById('editTitle').value        = ev.title        || '';
    document.getElementById('editDate').value         = ev.event_date   || '';
    document.getElementById('editTime').value         = ev.event_time   || '';
    document.getElementById('editLocation').value     = ev.location     || '';
    document.getElementById('editRegistration').value = ev.registration || '';
    document.getElementById('editWriteup').value      = ev.writeup      || '';
    document.getElementById('editModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('editModal').classList.remove('open');
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.getElementById('modalSave').addEventListener('click', async function () {
    const id           = document.getElementById('editId').value;
    const title        = document.getElementById('editTitle').value.trim();
    const event_date   = document.getElementById('editDate').value.trim();
    const event_time   = document.getElementById('editTime').value.trim();
    const location     = document.getElementById('editLocation').value.trim();
    const registration = document.getElementById('editRegistration').value.trim();
    const writeup      = document.getElementById('editWriteup').value.trim();

    if (!title || !event_date) { showToast('Title and date are required.', 'error'); return; }

    this.disabled = true;
    this.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Saving...';

    try {
      const res = await fetch(`${BACKEND}/api/events/update/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, event_date, event_time, location, registration, writeup })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Update failed');
      showToast('Event updated successfully.');
      closeModal();
      loadEvents();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      this.disabled = false;
      this.innerHTML = '<i class="fa fa-save"></i> Save Changes';
    }
  });

  loadEvents();
</script>
