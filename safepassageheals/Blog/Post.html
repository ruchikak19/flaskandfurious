<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f5fb;
    --border: #ddd5ee;
    --text: #2a1f3d;
    --muted: #7a6a95;
    --accent: #6b3fa0;
    --accent-mid: #8b5bbf;
    --accent-light: #c9a8e8;
    --accent-bg: #f0eaf8;
  }

  .top-bar,
  .custom-header {
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
  }

  .top-bar {
    background-color: #7B5EA7;
    color: white;
    padding: 8px 40px;
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-bar a {
    color: #ffd700;
    text-decoration: none;
    font-weight: 600;
  }

  .custom-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 40px;
    background-color: white;
    border-bottom: 1px solid #eee;
  }

  .custom-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.5rem;
    font-weight: bold;
    color: #7B5EA7;
  }

  .custom-header nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #333;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.9rem;
  }

  .custom-header nav a:hover {
    color: #7B5EA7;
  }

  /* ── SPLIT ── */
  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }

  /* LEFT — Image */
  .split-image {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }

  .split-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .split-image .placeholder {
    width: 100%;
    height: 100%;
    background: var(--accent-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }

  .split-image .placeholder:hover { background: #e8dff5; }

  .split-image .placeholder svg {
    width: 44px; height: 44px;
    stroke: var(--accent-light);
    fill: none;
    stroke-width: 1.5;
  }

  .split-image .placeholder span {
    color: var(--accent-mid);
    font-weight: 500;
  }

  #imageInput { display: none; }

  /* RIGHT — Content */
  .split-content {
    padding: 4.5rem 4rem 5rem 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    background: #fff;
  }

  .post-category {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-bg);
    border: 1px solid var(--accent-light);
    padding: 0.28rem 0.85rem;
    border-radius: 20px;
    margin-bottom: 1.6rem;
    width: fit-content;
    outline: none;
    font-weight: 500;
  }

  /* ── Form fields ── */
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 1.2rem;
  }

  .field-group label {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
  }

  .field-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--text);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--border);
    padding: 0.45rem 0;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }

  .field-input:focus {
    border-bottom-color: var(--accent);
  }

  .field-input::placeholder {
    color: var(--accent-light);
  }

  .split-content h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3vw, 2.8rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 0;
    color: var(--text);
    outline: none;
    border: none;
    background: transparent;
    width: 100%;
    padding: 0;
    font-style: italic;
  }

  .h1-wrapper {
    margin-bottom: 1.2rem;
  }

  .meta-row {
    display: flex;
    gap: 1rem;
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 2px solid var(--accent-bg);
  }

  .meta-row .field-group {
    flex: 1;
    margin-bottom: 0;
  }

  textarea.field-input {
    resize: vertical;
    min-height: 140px;
    line-height: 1.85;
    font-weight: 300;
    padding-top: 0.6rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding-left: 0.75rem;
    padding-right: 0.75rem;
  }

  textarea.field-input:focus {
    border-color: var(--accent);
  }

  /* ── Save button ── */
  .button-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 2.5rem;
  }

  .save-btn {
    padding: 0.8rem 2.2rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 30px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .exit-btn {
    padding: 0.8rem 2.2rem;
    background: #fff;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 30px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.1s;
  }

  .save-btn:hover  { background: var(--accent-mid); }
  .save-btn:active { transform: scale(0.97); }
  .save-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .exit-btn:hover { background: var(--accent-bg); }
  .exit-btn:active { transform: scale(0.97); }

  /* ── Status message ── */
  .status-msg {
    margin-top: 1rem;
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    min-height: 1.2em;
  }
  .status-msg.success { color: #3a8a5a; }
  .status-msg.error   { color: #c0392b; }

  .edit-hint {
    margin-top: 3rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
    font-size: 0.7rem;
    color: var(--accent-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media (max-width: 768px) {
    .split {
      grid-template-columns: 1fr;
      grid-template-rows: 50vw auto;
    }
    .split-image { position: relative; height: 50vw; top: 0; }
    .split-content { padding: 2.5rem 1.5rem; }
    .meta-row { flex-direction: column; gap: 0; }
  }
</style>

<!-- ── Map Modal ── -->

      width:min(680px,95vw); max-height:90vh;
      display:flex; flex-direction:column;
      overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,0.25);">

      <!-- Header -->
      <div style="padding:1rem 1.5rem; border-bottom:1px solid #eee;

<script type="module">
  import { pythonURI } from "{{ site.baseurl }}/assets/js/api/config.js";

  /* ── Image preview ── */
  const imageInput = document.getElementById('imageInput');
  const imagePanel = document.getElementById('imagePanel');
  const placeholder = document.getElementById('imagePlaceholder');

  imageInput.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      placeholder.style.display = 'none';
      const existing = imagePanel.querySelector('img');
      if (existing) existing.remove();
      const img = document.createElement('img');
      img.src = e.target.result;
      img.style.cursor = 'pointer';
      img.title = 'Click to change image';
      img.onclick = () => imageInput.click();
      imagePanel.appendChild(img);
    };
    reader.readAsDataURL(file);
  });

  /* ── Submit ── */
  async function submitEvent() {
    const btn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');

    const title    = document.getElementById('titleInput').value.trim();
    const date     = document.getElementById('dateInput').value;
    const time     = document.getElementById('timeInput').value;
    const location = document.getElementById('locationInput').value.trim();
    const writeup  = document.getElementById('writeupInput').value.trim();
    const reg      = document.getElementById('regInput').value.trim();
    const flyerFile = imageInput.files[0];

    if (!title) {
      statusMsg.textContent = 'Please enter an event title.';
      statusMsg.className = 'status-msg error';
      return;
    }
    if (!date) {
      statusMsg.textContent = 'Please select a date.';
      statusMsg.className = 'status-msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';

    const formData = new FormData();
    formData.append('title',        title);
    formData.append('event_date',   date);
    formData.append('event_time',   time);
    formData.append('location',     location);
    formData.append('writeup',      writeup);
    formData.append('registration', reg);

    if (flyerFile) {
      formData.append('flyer', flyerFile);
    }

    try {
      const res = await fetch(`${pythonURI}/api/events/add`, {
        method: 'POST',
        credentials: 'include',   // ← sends cookies cross-origin
        body: formData
        // Don't set Content-Type — browser sets multipart boundary automatically
      });
      const data = await res.json();

      if (res.ok) {
        statusMsg.textContent = 'Event saved successfully! Redirecting to calendar...';
        statusMsg.className = 'status-msg success';
        // Redirect to calendar after 1.5 seconds
        setTimeout(() => {
          window.location.href = '{{ site.baseurl }}/sph/eventcalendar1/';
        }, 1500);
        // Optional: reset form
        // document.querySelectorAll('.field-input').forEach(el => { el.value = ''; el.textContent = ''; });
      } else {
        statusMsg.textContent = data.error || 'Something went wrong.';
        statusMsg.className = 'status-msg error';
      }
    } catch (err) {
      statusMsg.textContent = 'Network error — could not reach the server.';
      statusMsg.className = 'status-msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Event';
    }
  }

// Expose submitEvent to global scope for onclick handler
  window.submitEvent = submitEvent;
</script>

<script>
  let map, marker, searchTimeout;
  let pendingLat = null, pendingLng = null, pendingAddress = '';

  function openMapModal() {
    document.getElementById('mapModal').style.display = 'flex';
    if (!map) {
      map = L.map('leafletMap').setView([32.7157, -117.1611], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
      map.on('click', async function(e) {
        await reverseGeocode(e.latlng.lat, e.latlng.lng);
      });
    } else {
      setTimeout(() => map.invalidateSize(), 100);
    }
  }

  function closeMapModal() {
    document.getElementById('mapModal').style.display = 'none';
    document.getElementById('searchResults').style.display = 'none';
    pendingLat = null; pendingLng = null; pendingAddress = '';
    document.getElementById('selectedAddressLabel').textContent =
      'Click the map or search to select a location';
    document.getElementById('confirmLocationBtn').disabled = true;
    document.getElementById('confirmLocationBtn').style.opacity = '0.5';
  }

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const data = await res.json();
      setPendingLocation(lat, lng, data.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    } catch {
      setPendingLocation(lat, lng, `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    }
  }

  function setPendingLocation(lat, lng, address) {
    pendingLat = lat; pendingLng = lng; pendingAddress = address;
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng]).addTo(map);
    map.setView([lat, lng], 15);
    document.getElementById('selectedAddressLabel').textContent = address;
    document.getElementById('confirmLocationBtn').disabled = false;
    document.getElementById('confirmLocationBtn').style.opacity = '1';
  }

  function confirmLocation() {
    if (!pendingLat) return;
    document.getElementById('locationInput').value  = pendingAddress;
    document.getElementById('locationLat').value    = pendingLat;
    document.getElementById('locationLng').value    = pendingLng;
    closeMapModal();
  }

  function handleSearch(query) {
    clearTimeout(searchTimeout);
    const resultsDiv = document.getElementById('searchResults');
    if (query.length < 3) { resultsDiv.style.display = 'none'; return; }
    searchTimeout = setTimeout(async () => {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5`,
          { headers: { 'Accept-Language': 'en' } }
        );
        const results = await res.json();
        renderSearchResults(results);
      } catch { resultsDiv.style.display = 'none'; }
    }, 400);
  }

  function renderSearchResults(results) {
    const div = document.getElementById('searchResults');
    if (!results.length) { div.style.display = 'none'; return; }
    div.innerHTML = results.map(r => `
      <div onclick="selectSearchResult(${r.lat}, ${r.lon}, '${r.display_name.replace(/'/g,"\\'")}')"
           style="padding:0.6rem 1rem; cursor:pointer; font-size:0.85rem;
                  font-family:'DM Sans',sans-serif; border-bottom:1px solid #f0eaf8; color:#2a1f3d;"
           onmouseover="this.style.background='#f0eaf8'"
           onmouseout="this.style.background='#fff'">
        ${r.display_name}
      </div>`).join('');
    div.style.display = 'block';
  }

  function selectSearchResult(lat, lng, address) {
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('mapSearchInput').value = '';
    setPendingLocation(parseFloat(lat), parseFloat(lng), address);
  }

  document.getElementById('mapModal').addEventListener('click', function(e) {
    if (e.target === this) closeMapModal();
  });
</script>
