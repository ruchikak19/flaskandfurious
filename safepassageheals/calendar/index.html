---
layout: default
title: Event Calendar
permalink: /sph/eventcalendar/
---

<div id="calendar"></div>
<!-- User bar -->
<div id="user-bar" style="
  max-width: 900px;
  margin: 24px auto 0 auto;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  font-family: 'Segoe UI', sans-serif;
">
  <span id="user-greeting" style="color:#4f46e5; font-weight:600; font-size:0.95rem;"></span>
  <button id="logout-btn" style="display:none;
    padding: 7px 16px;
    background: white;
    color: #ef4444;
    border: 1.5px solid #ef4444;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.88rem;"
    onclick="fetch('${BACKEND}/api/authenticate', {method:'DELETE', credentials:'include'}).finally(() => window.location.href='{{ site.baseurl }}/sph/login/')">
    Sign Out
  </button>
  <a id="login-btn" href="{{ site.baseurl }}/login/" style="display:none;
    padding: 7px 16px;
    background: #4f46e5;
    color: white;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.88rem;
    text-decoration: none;">
    Sign In
  </a>
</div>
<div id="event-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1000; justify-content:center; align-items:center;">
  <div id="modal-overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6);"></div>
  <div id="modal-content" style="
    position:relative;
    background-size: cover;
    background-position: center;
    border-radius: 12px;
    padding: 40px;
    max-width: 500px;
    width: 90%;
    z-index: 1001;
    color: white;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  ">
    <button id="modal-close" style="position:absolute; top:10px; right:14px; background:none; border:none; font-size:24px; color:white; cursor:pointer;">&times;</button>
    <h2 id="modal-title"></h2>
    <p id="modal-writeup"></p>
    <p id="modal-location"></p>
    <a id="modal-registration" href="#" target="_blank" style="color:#ffd700; font-weight:bold;"></a>
  </div>
</div>

<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet"/>
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script type ="module">
import {pythonURI, fetchOptions} from "{{ site.baseurl }}/assets/js/api/config.js";

document.addEventListener('DOMContentLoaded', async function() {
  const BACKEND = pythonURI;
  // Check session and update user bar
  try {
    const res = await fetch(`${BACKEND}/api/id`, { credentials: 'include' });
    if (res.ok) {
      const user = await res.json();
      document.getElementById('user-greeting').textContent = `Hello, ${user.name || user.uid}`;
      document.getElementById('logout-btn').style.display = 'inline-block';
    } else {
      document.getElementById('login-btn').style.display = 'inline-block';
    }
  } catch (_) {
    document.getElementById('login-btn').style.display = 'inline-block';
  }
  var calendarEl = document.getElementById('calendar');
  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
    },
    navLinks: true,
    selectable: true,
    selectMirror: true,
    dayMaxEvents: true,
    events: BACKEND + '/api/events',
    eventClick: function(info) {
      const e = info.event.extendedProps;

      document.getElementById('modal-title').textContent = info.event.title;
      document.getElementById('modal-writeup').textContent = e.writeup || '';
      document.getElementById('modal-location').textContent = e.location ? 'Location: ' + e.location : '';

      const regLink = document.getElementById('modal-registration');
      if (e.registration) {
        regLink.href = e.registration;
        regLink.textContent = 'Register Here';
      } else {
        regLink.textContent = '';
      }

      const flyer = e.flyer || '/images/docx/Safe_Passage.png';
      const flyerPath = flyer.startsWith('/') ? flyer : '/' + flyer;
      document.getElementById('modal-content').style.backgroundImage = `url('${BACKEND}${flyerPath}')`;
      const modal = document.getElementById('event-modal');
      modal.style.display = 'flex';
    },
  });

  calendar.render();
});
</script>

<style>
#calendar {
  max-width: 900px;
  margin: 40px auto;
}
body {
  position: relative;
  background-color: #ffffff;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('/flaskandfurious/safepassageheals/Safe_Passage.png');
  background-repeat: no-repeat;
  background-position: center;
  background-size: 400px;
  opacity: 0.08;
  z-index: -1;
}
.purple-bar {
  width: 100%;
  height: 40px;
  background-color: #6f5aa8;
  display: block;
}
</style>
