---
layout: default
title: Event Calendar
permalink: /sph/eventcalendar/
---

<!-- User bar -->
<div id="user-bar" style="
  max-width: 900px;
  margin: 24px auto 0 auto;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  font-family: 'Segoe UI', sans-serif;
">
  <span id="user-greeting" style="color:#4f46e5; font-weight:600; font-size:0.95rem;"></span>
  <button id="logout-btn" style="display:none;
    padding: 7px 16px;
    background: white;
    color: #ef4444;
    border: 1.5px solid #ef4444;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.88rem;"
    onclick="fetch('${BACKEND}/api/authenticate', {method:'DELETE', credentials:'include'}).finally(() => window.location.href='{{ site.baseurl }}/login')">
    Sign Out
  </button>
  <a id="login-btn" href="{{ site.baseurl }}/login" style="display:none;
    padding: 7px 16px;
    background: #4f46e5;
    color: white;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.88rem;
    text-decoration: none;">
    Sign In
  </a>
</div>

<!-- Edit Events Button -->
<div id="edit-events-bar" style="
  max-width: 900px;
  margin: 16px auto 0 auto;
">
  <a id="edit-events-btn" href="{{ site.baseurl }}/blog/post" style="display:none;
    padding: 9px 20px;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;">
    ✏️ Edit Events
  </a>
</div>

<div id="calendar"></div>

<!-- MODAL -->
<div id="event-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1000; justify-content:center; align-items:center;">
  
  <div id="modal-overlay" style="position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.6);"></div>

  <div id="modal-content" style="
    position:relative;
    background:white;
    border-radius: 12px;
    max-width: 700px;
    width: 95%;
    display: flex;
    overflow: hidden;
    z-index: 1001;
  ">

    <!-- IMAGE -->
    <div style="flex:1; background:black;">
      <img id="modal-image" src="" style="width:100%; height:100%; object-fit:contain;">
    </div>

    <!-- TEXT -->
    <div style="flex:1; padding:20px; color:black;">
      <button id="modal-close" style="position:absolute; top:10px; right:14px; background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>

      <h2 id="modal-title"></h2>
      <p id="modal-time"></p>
      <p id="modal-writeup"></p>
      <p id="modal-location"></p>
      <a id="modal-registration" href="#" target="_blank" style="color:#2563eb; font-weight:bold;"></a>
    </div>

  </div>
</div>

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script type="module">
import {pythonURI} from "{{ site.baseurl }}/assets/js/api/config.js";

document.addEventListener('DOMContentLoaded', async function() {
  const BACKEND = pythonURI;

  // Auth UI
  try {
    const res = await fetch(`${BACKEND}/api/id`, { credentials: 'include' });
    if (res.ok) {
      const user = await res.json();
      document.getElementById('user-greeting').textContent = `Hello, ${user.name || user.uid}`;
      document.getElementById('logout-btn').style.display = 'inline-block';
      if (user.role === 'Admin') {
        document.getElementById('edit-events-btn').style.display = 'inline-block';
      }
    } else {
      document.getElementById('login-btn').style.display = 'inline-block';
    }
  } catch {
    document.getElementById('login-btn').style.display = 'inline-block';
  }

  // Calendar
  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    events: BACKEND + '/api/events',

    eventClick: function(info) {
      const e = info.event.extendedProps;

      document.getElementById('modal-title').textContent = info.event.title;
      document.getElementById('modal-writeup').textContent = e.description || '';
      document.getElementById('modal-location').textContent = e.location ? 'Location: ' + e.location : '';

      const flyer = e.flyer || '/images/docx/Safe_Passage.png';
      const flyerPath = flyer.startsWith('/') ? flyer : '/' + flyer;

      // ✅ FIXED IMAGE LINE
      document.getElementById('modal-image').src = `${BACKEND}${flyerPath}`;

      const modal = document.getElementById('event-modal');
      modal.style.display = 'flex';
    }
  });

  calendar.render();

  // Close modal
  document.getElementById('modal-close').onclick = () => {
    document.getElementById('event-modal').style.display = 'none';
  };

  document.getElementById('modal-overlay').onclick = () => {
    document.getElementById('event-modal').style.display = 'none';
  };
});
</script>

<style>
#calendar {
  max-width: 900px;
  margin: 40px auto;
}

@media (max-width: 600px) {
  #modal-content {
    flex-direction: column;
  }
}
</style>
