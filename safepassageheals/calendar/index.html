---
layout: default
title: Event Calendar
permalink: /sph/eventcalendar/
---

<div id="user-bar" style="max-width:900px;margin:24px auto;display:flex;justify-content:flex-end;gap:12px;font-family:'Segoe UI',sans-serif;">
  <span id="user-greeting" style="color:#4f46e5;font-weight:600;"></span>
  <button id="logout-btn" style="display:none;padding:7px 16px;border:1.5px solid #ef4444;border-radius:8px;color:#ef4444;background:white;"
    onclick="fetch('${BACKEND}/api/authenticate',{method:'DELETE',credentials:'include'}).finally(()=>window.location.href='{{ site.baseurl }}/login')">
    Sign Out
  </button>
  <a id="login-btn" href="{{ site.baseurl }}/login" style="display:none;padding:7px 16px;background:#4f46e5;color:white;border-radius:8px;text-decoration:none;">
    Sign In
  </a>
</div>

<div id="calendar"></div>

<!-- MODAL -->
<div id="event-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;justify-content:center;align-items:center;">
  <div id="modal-overlay" style="position:absolute;width:100%;height:100%;background:rgba(0,0,0,0.6);"></div>

  <div id="modal-content" style="position:relative;background:white;border-radius:12px;max-width:700px;width:95%;display:flex;overflow:hidden;z-index:1001;">
    
    <div style="flex:1;background:black;">
      <img id="modal-image" src="" style="width:100%;height:100%;object-fit:contain;">
    </div>

    <div style="flex:1;padding:20px;color:black;">
      <button id="modal-close" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:24px;cursor:pointer;">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-time"></p>
      <p id="modal-writeup"></p>
      <p id="modal-location"></p>
      <a id="modal-registration" target="_blank" style="color:#2563eb;font-weight:bold;"></a>
    </div>

  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script type="module">
import { pythonURI } from "{{ site.baseurl }}/assets/js/api/config.js";

document.addEventListener('DOMContentLoaded', async function () {
  const BACKEND = pythonURI;

  // Auth
  try {
    const res = await fetch(`${BACKEND}/api/id`, { credentials: 'include' });
    if (res.ok) {
      const user = await res.json();
      document.getElementById('user-greeting').textContent = `Hello, ${user.name || user.uid}`;
      document.getElementById('logout-btn').style.display = 'inline-block';
    } else {
      document.getElementById('login-btn').style.display = 'inline-block';
    }
  } catch {
    document.getElementById('login-btn').style.display = 'inline-block';
  }

  // Calendar
  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    events: BACKEND + '/api/events',

    eventClick: function(info) {
      const e = info.event.extendedProps;

      const start = info.event.start;
      const end = info.event.end;

      const formatDate = d => new Intl.DateTimeFormat('en-US', {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }).format(d);

      let timeText = '';
      if (start) {
        timeText = formatDate(start);
        if (end && end > start) timeText += ` — ${formatDate(end)}`;
      }

      document.getElementById('modal-title').textContent = info.event.title;
      document.getElementById('modal-time').textContent = timeText ? `Time: ${timeText}` : '';
      document.getElementById('modal-writeup').textContent = e.description || e.writeup || '';
      document.getElementById('modal-location').textContent = e.location ? 'Location: ' + e.location : '';

      const reg = document.getElementById('modal-registration');
      if (e.registration) {
        reg.href = e.registration;
        reg.textContent = 'Register Here';
      } else {
        reg.textContent = '';
      }

      const flyer = e.flyer || '/images/docx/Safe_Passage.png';
      const path = flyer.startsWith('/') ? flyer : '/' + flyer;
      document.getElementById('modal-image').src = `${BACKEND}${path}`;

      document.getElementById('event-modal').style.display = 'flex';
    }
  });

  calendar.render();

  document.getElementById('modal-close').onclick = () =>
    document.getElementById('event-modal').style.display = 'none';

  document.getElementById('modal-overlay').onclick = () =>
    document.getElementById('event-modal').style.display = 'none';
});
</script>

<style>
#calendar { max-width:900px; margin:40px auto; }

@media (max-width:600px){
  #modal-content { flex-direction:column; }
}
</style>
