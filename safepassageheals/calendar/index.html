<div id="calendar"></div>

<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet"/>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {

        initialView: 'dayGridMonth',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },

        navLinks: true,
        selectable: true,
        selectMirror: true,
        dayMaxEvents: true,

        // CONNECTS TO FLASK API
        events: "http://localhost:8421/api/events",

        eventClick: function(info) {

            const e = info.event.extendedProps;

            alert(
                info.event.title + "\n\n" +
                e.writeup + "\n\n" +
                "Location: " + e.location
            );

        }

    });

    calendar.render();

});
</script>

<style>
  /* Optional: set a height and center the calendar */
  #calendar {
    max-width: 900px;
    margin: 40px auto;
  }
   body {
    position: relative;
    background-color: #ffffff;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;


    background-image: url('/safepassageheals/Safe_Passage.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 400px;

    opacity: 0.08;
    z-index: -1;
  }

.purple-bar {
    width: 100%;
    height: 40px;
    background-color: #6f5aa8;
    display: block;
}
</style>
