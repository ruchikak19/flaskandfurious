<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script type="module">
import {pythonURI, fetchOptions} from "{{ site.baseurl }}/assets/js/api/config.js";

document.addEventListener('DOMContentLoaded', async function() {
  const BACKEND = pythonURI;

  // Check session and update user bar
  try {
    const res = await fetch(`${BACKEND}/api/id`, { credentials: 'include' });
    if (res.ok) {
      const user = await res.json();
      document.getElementById('user-greeting').textContent = `Hello, ${user.name || user.uid}`;
      document.getElementById('logout-btn').style.display = 'inline-block';

      // Show Edit Events button only for admins
      if (user.role === 'Admin') {
        document.getElementById('edit-events-btn').style.display = 'inline-block';
      }
    } else {
      document.getElementById('login-btn').style.display = 'inline-block';
    }
  } catch (_) {
    document.getElementById('login-btn').style.display = 'inline-block';
  }

  var calendarEl = document.getElementById('calendar');
  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
    },
    navLinks: true,
    selectable: true,
    selectMirror: true,
    dayMaxEvents: true,
    events: BACKEND + '/api/events',
    eventClick: function(info) {
      const e = info.event.extendedProps;
      const start = info.event.start;
      const end = info.event.end;
      const eventDescription = e.description || e.writeup || '';

      const formatDate = date => new Intl.DateTimeFormat('en-US', {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,
      }).format(date);

      let timeText = '';
      if (start) {
        timeText = formatDate(start);
        if (end && end > start) {
          timeText += ` — ${formatDate(end)}`;
        }
      }

      document.getElementById('modal-title').textContent = info.event.title;
      document.getElementById('modal-time').textContent = timeText ? `Time: ${timeText}` : '';
      document.getElementById('modal-writeup').textContent = eventDescription;
      document.getElementById('modal-location').textContent = e.location ? 'Location: ' + e.location : '';

      const regLink = document.getElementById('modal-registration');
      if (e.registration) {
        let regUrl = e.registration.trim();
        if (!/^https?:\/\//i.test(regUrl)) {
          regUrl = 'https://' + regUrl;
        }
        regLink.href = regUrl;
        regLink.textContent = 'Register Here';
      } else {
        regLink.textContent = '';
      }

      const flyer = e.flyer || '/images/docx/Safe_Passage.png';
      const flyerPath = flyer.startsWith('/') ? flyer : '/' + flyer;
      document.getElementById('modal-image').style.backgroundImage = `url('${BACKEND}${flyerPath}')`;
      const modal = document.getElementById('event-modal');
      modal.style.display = 'flex';
    },
  });

  calendar.render();

  const modal = document.getElementById('event-modal');
  const closeButton = document.getElementById('modal-close');
  const overlay = document.getElementById('modal-overlay');

  const closeModal = () => {
    modal.style.display = 'none';
  };

  closeButton.addEventListener('click', closeModal);
  overlay.addEventListener('click', closeModal);
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const flowerGroup = document.getElementById('flower-bloom-group');
  const flowerSVG = document.getElementById('corner-flower');
  const popup = document.getElementById('corner-popup');
  const closeBtn = document.getElementById('corner-popup-close');
  if (flowerGroup && flowerSVG) {
    setTimeout(() => {
      flowerGroup.style.transform = 'scale(1)';
      flowerGroup.style.opacity = '1';
      flowerSVG.classList.add('bloomed');
      setTimeout(showCornerPopup, 2200);
    }, 400);
  }
  function showCornerPopup() {
    if (!popup) return;
    popup.style.display = 'block';
    fetchCornerEvents();
  }
  function hideCornerPopup() {
    popup.style.display = 'none';
  }
  if (closeBtn) closeBtn.onclick = hideCornerPopup;
  async function fetchCornerEvents() {
    const list = document.getElementById('corner-events-list');
    list.innerHTML = '<li style="color:#7c3aed;">Loading…</li>';
    try {
      const BACKEND = (window.pythonURI || (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:8421" : "https://flaskandfurious.opencodingsociety.com");
      const res = await fetch(BACKEND + '/api/events', { credentials: 'include' });
      if (!res.ok) throw new Error('Failed to fetch events');
      const events = await res.json();
      const now = new Date();
      const upcoming = (Array.isArray(events) ? events : []).filter(ev => {
        const d = new Date(ev.event_date || ev.start || ev.date);
        return d > now;
      }).sort((a, b) => new Date(a.event_date || a.start || a.date) - new Date(b.event_date || b.start || b.date)).slice(0, 3);
      if (!upcoming.length) {
        list.innerHTML = '<li style="color:#7c3aed;">No upcoming events!</li>';
        return;
      }
      list.innerHTML = upcoming.map(ev => {
        const date = new Date(ev.event_date || ev.start || ev.date);
        const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        return `<li><b>${ev.title || 'Untitled'}</b> <span style="color:#a78bfa;font-weight:400;">${dateStr}</span></li>`;
      }).join('');
    } catch (e) {
      list.innerHTML = '<li style="color:#b91c1c;">Could not load events.</li>';
    }
  }
});
</script>
