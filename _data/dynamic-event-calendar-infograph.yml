    description: "Safe Passage Heals hosts workshops, support groups, and community events for survivors of domestic violence. Previously, event info was scattered across posts and flyers, making it hard to find. The Dynamic Event Calendar centralizes all events in an interactive view where users can click events to view details, flyers, and registration links. It is built with FullCalendar.js on the frontend and a Flask + SQLite backend using a REST API."
